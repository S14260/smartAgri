<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>AI 圈地 Demo - 单地块选择</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
<style>
#map { width: 100%; height: 800px; }

#btn, #exportBtn, #simplifyRange {
    position: absolute;
    top: 10px;
    z-index: 1000;
    padding: 6px 12px;
}

#btn { left: 120px; }
#exportBtn { left: 260px; }
#simplifyRange { left: 420px; width: 150px; }

/* 编辑点大小 */
.leaflet-editing-icon {
  width: 8px !important;
  height: 8px !important;
  margin-left: -4px;
  margin-top: -4px;
  border-radius: 50%;
  border: 2px solid #fff;
  background-color: red;
}
</style>
</head>
<body>
<button id="btn">AI 自动圈地</button>
<button id="exportBtn">导出 GeoJSON</button>
<label for="simplifyRange">简化强度</label>
<input type="range" id="simplifyRange" min="1" max="50" value="5">

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet-image/leaflet-image.js"></script>

<script>
const tk = "19fc987939ebbcbcb3f0954ab6cf75be";
const map = L.map("map").setView([39.1, 117.1], 13);

L.tileLayer(
  "http://t{s}.tianditu.gov.cn/img_w/wmts?" +
  "service=wmts&request=GetTile&version=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&" +
  "TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=tiles&tk=" + tk,
  { subdomains: "01234567", maxZoom: 18 }
).addTo(map);
L.tileLayer(
  "http://t{s}.tianditu.gov.cn/cia_w/wmts?" +
  "service=wmts&request=GetTile&version=1.0.0&LAYER=cia&STYLE=default&TILEMATRIXSET=w&" +
  "TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=tiles&tk=" + tk,
  { subdomains: "01234567", maxZoom: 18 }
).addTo(map);

const drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);
const drawControl = new L.Control.Draw({
  edit: { featureGroup: drawnItems },
  draw: false
});
map.addControl(drawControl);

let allPolygons = [];  // 存储AI检测的所有多边形
const simplifyRange = document.getElementById("simplifyRange");

document.getElementById("btn").onclick = async function () {
  drawnItems.clearLayers();

  leafletImage(map, async function(err, canvas) {
    if (err) { alert("截图失败"); return; }

    canvas.toBlob(async function(blob) {
      const bounds = map.getBounds();
      const payload = new FormData();
      payload.append("file", blob, "screenshot.jpg");
      payload.append("bounds", JSON.stringify([
        [bounds.getNorth(), bounds.getWest()],
        [bounds.getSouth(), bounds.getEast()]
      ]));

      try {
        const res = await fetch("http://localhost:8081/predict", { method:"POST", body:payload });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (data.polygons) {
          // 调用简化接口
          const simplifyRes = await fetch("http://localhost:8082/simplify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              polygons: data.polygons,
              tolerance: simplifyRange.value / 100000
            })
          });
          const simpleData = await simplifyRes.json();
          allPolygons = []; // 重置保存的多边形列表

          // 临时绘制透明地块供选择
          simpleData.simplified_polygons.forEach(latlngs => {
            const poly = L.polygon(latlngs, { color: "red", fillOpacity: 0.15 });
            allPolygons.push(poly);
            poly.addTo(map);
          });

          alert("✅ 点击任意一个地块中间，只保留该地块！");
        } else if (data.error) {
          alert("AI预测出错: " + data.error);
        }
      } catch (err) {
        alert("请求失败: " + err.message);
      }
    }, "image/jpeg", 0.7);
  });
};

// 点击地图选择地块
map.on("click", function(e) {
  if (allPolygons.length === 0) return;

  const clickedPoint = e.latlng;
  let selectedPolygon = null;

  for (const poly of allPolygons) {
    if (poly.getBounds().contains(clickedPoint)) {
      // 二次检测：点是否真正位于多边形内部
      if (L.Polyline.prototype.isPointInside
        ? poly.isPointInside(clickedPoint)
        : L.Polygon.prototype.isPointInside?.call(poly, clickedPoint)) {
        selectedPolygon = poly;
        break;
      } else {
        // 如果没有 isPointInside 方法，则用 leaflet 的自带函数
        const latlngs = poly.getLatLngs()[0];
        if (isPointInPolygon(clickedPoint, latlngs)) {
          selectedPolygon = poly;
          break;
        }
      }
    }
  }

  if (selectedPolygon) {
    drawnItems.clearLayers();
    allPolygons.forEach(p => map.removeLayer(p));
    selectedPolygon.setStyle({ color:"red", fillOpacity:0.4 });
    drawnItems.addLayer(selectedPolygon);
    drawControl._toolbars.edit._modes.edit.handler.enable();
    alert("✅ 已选择该地块，可编辑或导出！");
  }
});

// 射线法,dianzaineibupanduan
function isPointInPolygon(point, vs) {
  const x = point.lng, y = point.lat;
  let inside = false;
  for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
    const xi = vs[i].lng, yi = vs[i].lat;
    const xj = vs[j].lng, yj = vs[j].lat;
    const intersect = ((yi > y) !== (yj > y)) &&
                      (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

document.getElementById("exportBtn").onclick = function () {
  const geojson = { type:"FeatureCollection", features: [] };
  drawnItems.eachLayer(layer => {
    if (layer instanceof L.Polygon) {
      const coords = layer.getLatLngs()[0].map(ll => [ll.lng, ll.lat]);
      geojson.features.push({
        type:"Feature",
        geometry:{ type:"Polygon", coordinates:[coords] },
        properties:{}
      });
    }
  });
  const blob = new Blob([JSON.stringify(geojson,null,2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "polygon.geojson";
  a.click();
  URL.revokeObjectURL(url);
};
</script>
</body>
</html>
